[project]
name = "transit-bench"
version = "0.1.0"
description = "JAX benchmark environments for passenger dispatch on transport networks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "John Paul Alexander" }]
requires-python = ">=3.12"
# JAX is the backend of every env, so it is a core dependency. The Python
# reference sims use Gymnasium and NumPy; optax is for the reference PPO.
dependencies = [
    "gymnasium>=1.0",
    "jax>=0.6",
    "numpy>=1.26",
    "optax>=0.2.4",
]

[project.optional-dependencies]
bound = [
    "highspy>=1.15.1",
]

[dependency-groups]
# The CUDA 12 plugin: CUDA 13 builds dropped Pascal GPUs (GTX 10xx).
#   uv sync --group jax-cuda
jax-cuda = ["jax[cuda12]>=0.6 ; sys_platform == 'linux'"]
dev = [
    "highspy>=1.15.1",
    "pytest>=9",
    "ruff>=0.6",
    "scipy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transit_bench"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: long-running tests (deselected by default; run with -m slow)"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
